<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      (() => {
        const host = location.hostname;
        const local =
          location.protocol === "file:" ||
          host === "localhost" ||
          host === "127.0.0.1" ||
          host === "[::1]";
        if (!local) {
          location.replace("index.html");
          return;
        }
        location.replace("media-editor.html");
      })();
    </script>
    <title>Media Editor — RRFC</title>
  </head>
  <body></body>
</html>
